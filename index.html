    // Capture User Location and Login via Google
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      
      // Get Geolocation automatically on login
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          completeLogin(lat, lon);
        }, (error) => {
          // If location permission denied, proceed without location
          completeLogin(null, null);
        });
      } else {
        completeLogin(null, null);
      }
    }

    function completeLogin(lat, lon) {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          activeUser = {
            email: user.email,
            name: user.displayName || "User",
            photo: user.photoURL || defaultAvatar,
            role: selectedRole,
            latitude: lat,
            longitude: lon
          };
          localStorage.setItem("ruvestra_joined_user", JSON.stringify(activeUser));
          
          checkUserJoinStatus();
          renderServices();
          showToast("Google से लॉगिन और लोकेशन सेट सफल!");
        })
        .catch((error) => {
          alert("लॉगिन में समस्या आई: " + error.message);
        });
    }

    function submitSupportRequest() {
      const name = document.getElementById("supportNameInput").value.trim() || (activeUser ? activeUser.name : 'User');
      const issue = document.getElementById("supportIssueType").value;
      const msg = document.getElementById("supportMsgInput").value.trim();

      if (!msg) {
        alert("कृपया अपनी समस्या विवरण में लिखें।");
        return;
      }

      const subject = encodeURIComponent(`[RUVESTRA Help] ${issue} - ${name}`);
      const body = encodeURIComponent(`नाम: ${name}\nईमेल: ${activeUser ? activeUser.email : 'Not Logged In'}\nसमस्या प्रकार: ${issue}\n\nविवरण:\n${msg}`);

      window.location.href = `mailto:${adminEmail}?subject=${subject}&body=${body}`;
    }

    function checkUserJoinStatus() {

        if (activeUser.photo) {

        }
        modal.style.display = "none";
        document.getElementById("supportNameInput").value = activeUser.name || '';
      } else {

        modal.style.display = "flex";
      }
    }

    function switchTab(tab) {
      const t = translations[currentLang];
      if(!activeUser && tab !== 'support') {
        showToast(t.toastJoinFirst);
        openJoinModal();
        return;
      }

      document.querySelectorAll(".view-section").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));

      if(tab === 'home') {
        document.getElementById("viewHome").classList.add("active");
        document.getElementById("navHome").classList.add("active");
      } else if(tab === 'addService') {
        document.getElementById("viewAddService").classList.add("active");

      } else if(tab === 'support') {
        document.getElementById("viewSupport").classList.add("active");
        document.getElementById("navSupport").classList.add("active");
      }
    }

    function saveNewService() {
      const t = translations[currentLang];
      const title = document.getElementById("srvTitle").value.trim();
      const catIndex = parseInt(document.getElementById("srvCategory").value);
      const phone = document.getElementById("srvPhone").value.trim();

      if(!title || phone.length < 10) {
        alert(t.toastFillAll);
        return;
      }

      const newSrv = {
        id: Date.now().toString(),
        userEmail: activeUser.email,
        userName: activeUser.name,
        role: activeUser.role,
        name: title,
        catIndex: catIndex,
        phone: phone,
        photo: activeUser.photo || defaultAvatar,
        latitude: activeUser.latitude || null,
        longitude: activeUser.longitude || null
      };

      services.unshift(newSrv);
      localStorage.setItem("ruvestra_services", JSON.stringify(services));
      
      renderServices();
      switchTab('home');
      showToast(t.toastPosted);
    }

    // Delete Post Logic (Only owner can delete)
    function deletePost(postId, postUserEmail) {
      if (!activeUser || activeUser.email !== postUserEmail) {
        alert("आप केवल अपनी खुद की पोस्ट डिलीट कर सकते हैं!");
        return;
      }

      if (confirm("क्या आप वाकई इस पोस्ट को हटाना चाहते हैं?")) {
        services = services.filter(s => s.id !== postId);
        localStorage.setItem("ruvestra_services", JSON.stringify(services));
        renderServices();
        showToast("पोस्ट सफलतापूर्वक हटा दी गई!");
      }
    }

    function renderServices() {
      const container = document.getElementById("servicesList");
      const t = translations[currentLang];
      const searchQuery = document.getElementById("searchInput").value.toLowerCase();

      let filtered = selectedFilterCategoryIndex === 0 
        ? services 
        : services.filter(s => s.catIndex === selectedFilterCategoryIndex);

      if(searchQuery) {
        filtered = filtered.filter(s => {
          const categoryName = categoriesData[s.catIndex] ? categoriesData[s.catIndex][currentLang].toLowerCase() : "";
          return s.name.toLowerCase().includes(searchQuery) || 
                 categoryName.includes(searchQuery) ||
                 (s.userName && s.userName.toLowerCase().includes(searchQuery)) ||
                 s.phone.includes(searchQuery);
        });
      }

      if(filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.85rem;">${t.noResult}</div>`;
        return;
      }

      container.innerHTML = filtered.map(s => {
        const catObj = categoriesData[s.catIndex] || categoriesData[1];
        const categoryLabel = catObj[currentLang];
        const roleLabel = s.role === 'Client' ? t.providerRole : t.customerRole;
        
        // Check if current logged-in user is the owner of this post
        const isOwner = activeUser && activeUser.email === s.userEmail;

        return `
          <div class="service-card">
            <div class="card-header">
              <div class="card-user-info">
                <img src="${s.photo || defaultAvatar}" class="card-avatar" />
                <div>
                  <div style="font-size:0.8rem; font-weight:800; color:var(--text-main);">${s.userName || 'User'}</div>
                  <div style="font-size:0.7rem; font-weight:700; color:var(--primary-accent);">${categoryLabel} • ${roleLabel}</div>
                </div>
              </div>
              ${isOwner ? `<button class="btn-delete" onclick="deletePost('${s.id}', '${s.userEmail}')">${t.deletePost}</button>` : ''}
            </div>
            
            <div style="font-weight:700; font-size:1rem; margin-top: 4px;">${s.name}</div>
            
            <div class="contact-actions" style="margin-top: 6px;">
              <a href="tel:${s.phone}" class="btn-contact btn-call">
                <i data-lucide="phone" style="width:14px;"></i> ${t.call} (${s.phone})
              </a>
              <a href="https://wa.me/91${s.phone}?text=${encodeURIComponent(currentLang === 'hi' ? 'नमस्कार, मैंने RUVESTRA ऐप से संपर्क किया है।' : 'Hello, I contacted you via RUVESTRA app.')}" target="_blank" class="btn-contact btn-whatsapp">
                <i data-lucide="message-circle" style="width:14px;"></i> ${t.wa}
              </a>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
